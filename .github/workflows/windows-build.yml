# Windows release build workflow
name: Windows Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Isolate frontend from broken root pnpm workspace
        shell: pwsh
        run: |
          if (Test-Path pnpm-workspace.yaml) {
            Move-Item pnpm-workspace.yaml pnpm-workspace.yaml.ci-disabled
          }

      - name: Prepare FFmpeg binary for Tauri bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path frontend/src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-temp -Force
          $ffmpeg = Get-ChildItem -Path ffmpeg-temp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ffmpeg.FullName frontend/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application
        working-directory: frontend
        run: pnpm tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: VoxMinutes-Windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.msi
