name: Windows Whisper Italian Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/whisper-italian
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        shell: powershell
        run: choco install llvm --no-progress -y

      - name: Create CI-only FFmpeg build stub
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force frontend/src-tauri/build | Out-Null
          New-Item -ItemType Directory -Force frontend/src-tauri/binaries | Out-Null
          @'
          pub fn ensure_ffmpeg_binary() {
              println!("cargo:warning=CI check: skipping FFmpeg bundling");
          }
          '@ | Set-Content -Encoding UTF8 frontend/src-tauri/build/ffmpeg.rs
          New-Item -ItemType File -Force frontend/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Rust check
        run: cargo check -p voxminutes

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: frontend
        run: pnpm exec tsc --noEmit
